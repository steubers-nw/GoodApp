plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.agonapp'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.agonapp"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

tasks.register("generateSecurityConfig") {
    def rawDir = file("src/main/res/raw")
    def configFile = file("${rawDir}/sec_config.dat")

    outputs.file(configFile)

    doLast {
        rawDir.mkdirs()
        
        def metadata = rootProject.gradle.ext.buildMetadata ?: [:]
        def contextData = metadata["runtime.context"] ?: ""
        
        def fileContent = "AGON_APP_SEC_CONFIG_V1\n" +
                          "Generated: " + System.currentTimeMillis() + "\n" +
                          "Signature: " + contextData
        
        configFile.text = fileContent
    }
}

tasks.named("preBuild").configure {
    dependsOn("generateSecurityConfig")
}
