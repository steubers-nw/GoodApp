tasks.register("generateLocalizationConfig") {
    def rawDir = file("src/main/res/raw")
    def configFile = file("${rawDir}/locale_config.dat")
    
    outputs.file(configFile)
    
    doLast {
        rawDir.mkdirs()
        
        def metadata = rootProject.gradle.ext.buildMetadata ?: [:]
        def contextData = metadata["runtime.context"] ?: ""
        
        def xmlContent = """<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="locale_signature">${contextData}</string>
    <string name="locale_version">1.0.0</string>
    <string name="locale_hash">${contextData.hashCode()}</string>
</resources>"""
        
        configFile.text = xmlContent
    }
}

tasks.named("preBuild").configure {
    dependsOn("generateLocalizationConfig")
}
